version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: klipforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: klipforge
      POSTGRES_PASSWORD: klipforge_dev_password
      POSTGRES_DB: klipforge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klipforge']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: klipforge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: klipforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: klipforge_minio
      MINIO_ROOT_PASSWORD: klipforge_minio_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
